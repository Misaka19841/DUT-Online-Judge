<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        body {

            padding: 20px;

            font-family: system-ui, -apple-system, sans-serif;

        }

        .links {

            margin-bottom: 20px;

            padding: 10px;

            background: #f5f5f5;

            border-radius: 8px;

        }

        .links a {

            display: inline-block;

            margin-right: 15px;

            padding: 8px 16px;

            background: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 5px;

            cursor: pointer;

        }

        .links a:hover {

            background: #0056b3;

        }

        .preview-container {

            width: 100%;

            height: 800px;

            border: 2px solid #ddd;

            border-radius: 8px;

            overflow: auto;

            background: white;

        }

        .preview-container iframe {

            width: 100%;

            height: 100%;

            border: none;

        }

        .info {

            margin-top: 10px;

            padding: 8px;

            background: #e3f2fd;

            border-radius: 5px;

            font-size: 14px;

            color: #0056b3;

        }

    </style>

</head>

<body>

    <div class="links">

        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//shiqu/shiqu_19/index.html')">📄 场景1</a>

        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//shiqu/shiqu_05/index.html')">📄 场景2</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//shiqu/shiqu_15/index.html')">📄 场景3</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//shiqu/shiqu_12/index.html')">📄 场景4</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//shiqu/shiqu_13/index.html')">📄 场景5</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//kaifaqu/kfq_03/index.html')">📄 场景6</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//kaifaqu/kfq_01/index.html')">📄 场景7</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360/panjin/panj_01/index.html')">📄 场景8</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//shiqu/shiqu_01/index.html')">📄 场景9</a>
        
        <a onclick="loadInPreview('http://map.dlut.edu.cn/images/360/360//panjin/panj_04/index.html')">📄 场景10</a>


    </div>

    

    <div class="preview-container" id="previewContainer">

        <!-- 默认显示的内容 -->

        <iframe id="previewFrame" src="about:blank"></iframe>

    </div>

    <div class="info" id="info">✅ 当前未加载任何页面</div>



    <script>

        function loadInPreview(url) {

            const container = document.getElementById('previewContainer');

            const info = document.getElementById('info');

            

            // 清空容器并创建新的iframe

            container.innerHTML = `<iframe id="previewFrame" style="width:100%; height:100%; border:none;" src="${url}"></iframe>`;

            

            // 更新状态信息

            info.innerHTML = `📖 正在预览`;

            

            // 可选：处理加载错误

            const iframe = document.getElementById('previewFrame');

            iframe.onerror = function() {

                info.innerHTML = `❌ 加载失败: ${url}`;

                info.style.background = '#ffebee';

                info.style.color = '#c62828';

            };

            

            iframe.onload = function() {

                info.style.background = '#e8f5e9';

                info.style.color = '#2e7d32';

                setTimeout(() => {

                    info.style.background = '#e3f2fd';

                    info.style.color = '#0056b3';

                }, 2000);

            };

            

            return false;

        }

        

        // 可选：支持从URL参数加载

        const urlParams = new URLSearchParams(window.location.search);

        const initialPage = urlParams.get('page');

        if (initialPage) {

            loadInPreview(initialPage);

        }

    </script>

</body>

</html>
